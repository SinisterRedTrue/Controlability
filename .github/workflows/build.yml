name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Controlability.sln
      - name: Build
        run: dotnet build Controlability.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Controlability.sln --configuration Release --no-build
